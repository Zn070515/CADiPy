repo_url: https://github.com/Zn070515/cadipy
site_url: https://zn070515.github.io/cadipy/
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
plugins:
  - search
nav:
