[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadipy"
description = "Production-oriented SOLIDWORKS automation and agent operation contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "XuXin", email = "247738477+Zn070515@users.noreply.github.com" }]
keywords = ["cad", "solidworks", "automation", "com", "agent", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Zn070515/cadipy"
Issues = "https://github.com/Zn070515/cadipy/issues"
Documentation = "https://github.com/Zn070515/cadipy#readme"
Source = "https://github.com/Zn070515/cadipy"

[project.optional-dependencies]
solidworks = ["pywin32>=312; platform_system == 'Windows'"]
mcp = ["mcp>=2.0,<3.0"]
all = ["pywin32>=312; platform_system == 'Windows'", "mcp>=2.0,<3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pywin32>=312; platform_system == 'Windows'",
]

[project.scripts]
cadipy = "cadipy.cli:main"

[tool.hatch.version]
path = "src/cadipy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cadipy"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs", "/examples", "/logs", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
filterwarnings = ["error"]
markers = [
    "solidworks: live SOLIDWORKS COM integration tests; unavailable environments skip normally",
    "real_solidworks: strict supported SOLIDWORKS integration contract",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["AGENTS.md", "docs/", "logs/", ".worktrees/"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "A", "ARG", "C4", "DTZ", "ERA", "FLY", "ICN", "INP", "INT", "PERF",
    "PIE", "PT", "PTH", "PYI", "Q", "RET", "RUF", "SLF", "T", "TC", "TID",
    "TRY",
]
ignore = ["TRY003"]
allowed-confusables = ["（", "）", "，", "：", "；", "？", "＋", "×", "−", "–", "∪"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "ARG001", "ARG002", "ARG003", "ARG004", "ARG005", "PT011", "PT012", "PT018", "TRY301"]
"scripts/**" = ["INP001", "T201"]
"src/cadipy/cli.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
platform = "win32"
files = ["src/cadipy"]
ignore_missing_imports = true
show_error_codes = true
strict = true
