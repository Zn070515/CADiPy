name: SOLIDWORKS integration

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1-5"

permissions:
  contents: read

jobs:
  real-solidworks:
    runs-on: [self-hosted, windows, solidworks]
    timeout-minutes: 30
    env:
      CADIPY_REQUIRE_REAL_SOLIDWORKS: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra solidworks
      - run: uv run pytest tests/integration/solidworks -m real_solidworks --real-solidworks -q
